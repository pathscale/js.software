# Every declared outcome runs in one unfiltered invocation against the
# font-enabled native host. Adding a file or group automatically expands the
# gate; there is no hand-maintained group list that can drift from the corpus.
name: QA

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # The checks drive the built site, not the dev server: what ships is what
      # is asked about.
      - name: Build
        run: bun run build

      - name: Production response policy
        run: bun run qa:production-policy

      - name: Store the production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          retention-days: 1

  rendered-outcomes:
    needs: build
    runs-on: ubicloud-standard-4
    name: Rendered outcomes (complete corpus)
    steps:
      - uses: actions/checkout@v4

      - name: Restore the production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist

      - name: Headless browser host
        id: qa
        uses: pathscale/chuzz/.github/actions/headless-host@b0e4ce0d35fe96230c90d2a3ed55a64686abe370
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          ps-qa-version: ^0.7.4

      - name: Rendered outcomes
        env:
          # A shared runner is slower than a laptop for outcomes that pass
          # locally well inside the budget. This widens scheduling deadlines
          # only; every declared transition is still required.
          QA_TIMEOUT_SCALE: 2
        run: |
          ps-qa --app tests/ps-qa/ps-qa.ron \
            qa-hosted \
            --host "${{ steps.qa.outputs.host }}" \
            --page dist \
            --checks tests/ps-qa/checks \
            --require-outcomes

      - name: Every registered direct route
        env:
          QA_TIMEOUT_SCALE: 2
          CHUZZ_HEADLESS_BIN: ${{ steps.qa.outputs.host }}
          PS_QA_BIN: ps-qa
        run: tests/ps-qa/direct-route-outcomes.sh dist
